strict-sigcheck = false
cli-version = "dev"

[YouTube-Experimental]
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomName='YouTube' -OcustomIcon=icons/YouTube/branding"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[YT-Music-Experimental]
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomName='YT Music' -OcustomIcon=icons/Music/branding"

[YT-Music-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[Instagram-Experimental]
brand = "piko-dev"
github-dlurl = "https://github.com/krvstek/uni-storage/releases/tag/instagram"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Disable screenshot detection' -e 'Make ephemeral media permanent' -e 'View stories anonymously'"

[Instagram-Experimental.patches]
"github:crimera/piko" = { version = "dev" }

[YouTube-Stable]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
arch = "arm64-v8a"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomName='YouTube' -OcustomIcon=icons/YouTube/branding"

[YouTube-Stable.patches]
"github:MorpheApp/morphe-patches" = []

[YT-Music-Stable]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "arm64-v8a"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomName='YT Music' -OcustomIcon=icons/Music/branding"

[YT-Music-Stable.patches]
"github:MorpheApp/morphe-patches" = []

[Instagram]
brand = "piko"
github-dlurl = "https://github.com/krvstek/uni-storage/releases/tag/instagram"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
arch = "arm64-v8a"
#patcher-args = "-e 'Theme' -Oamoled=true"

[Instagram.patches]
"github:crimera/piko" = []

[Google-Photos]
brand = "rushi"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
arch = "arm64-v8a"
patcher-args = "-e 'Enable DCIM folders backup control' -e 'GmsCore support' -e 'Spoof features' -OgooglePhotosSpoofProfile=pixel_xl -e 'Change package name' -OgooglePhotosAppName=Photos"

[Google-Photos.patches]
"github:rushiranpise/morphe-patches" = []

[GPhotos]
brand = "devanced"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
arch = "arm64-v8a"
patcher-args = "-e 'Enable DCIM folders backup control'"

[GPhotos.patches]
"github:RookieEnough/De-Vanced" = []

[Facebook]
brand = "hush-facebook"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/facebook/"
arch = "arm64-v8a"

[Facebook.patches]
"github:SysAdminDoc/Hushfacebook" = []

[Messenger]
brand = "hush-messenger"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/messenger/"
arch = "arm64-v8a"
patcher-args = "-e 'Spoof package version'"

[Messenger.patches]
"github:SysAdminDoc/HushMessenger" = []

[HushGram]
app-name = "Instagram"
brand = "hush-instagram"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
arch = "arm64-v8a"
patcher-args = "-e 'View DM photos and videos anonymously' -e 'Change version code' -e 'Pure black dark mode'"

[HushGram.patches]
"github:SysAdminDoc/HushGram" = []
