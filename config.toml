strict-sigcheck = false

[YouTube-Experimental]
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomName='YouTube' -OappIcon=original"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[YT-Music-Experimental]
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomName='YT Music' -OappIcon=original"

[YT-Music-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[YouTube-Stable]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
arch = "arm64-v8a"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomName='YouTube' -OappIcon=original"

[YouTube-Stable.patches]
"github:MorpheApp/morphe-patches" = []

[YT-Music-Stable]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "arm64-v8a"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomName='YT Music' -OappIcon=original"

[YT-Music-Stable.patches]
"github:MorpheApp/morphe-patches" = []

[Facebook]
brand = "hush-facebook"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/facebook/"
arch = "arm64-v8a"

[Facebook.patches]
"github:SysAdminDoc/Hushfacebook" = []

[Messenger]
brand = "hush-messenger"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/messenger/"
arch = "arm64-v8a"
patcher-args = "-e 'Spoof package version'"

[Messenger.patches]
"github:SysAdminDoc/HushMessenger" = []

[HushGram]
app-name = "Instagram"
brand = "hush-instagram"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
arch = "arm64-v8a"
patcher-args = "-e 'Change version code' -e 'Pure black dark mode'"

[HushGram.patches]
"github:SysAdminDoc/HushGram" = []

[GPhotos]
app-name = "Google Photos"
brand = "gphotos"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
arch = "arm64-v8a"
#version = "latest"
#track-apk = true
changelog-keywords = ["photos", "gphotos", "Google Photos"]
patcher-args = '-e "Custom branding" -Oapp-name="\"Photos XL\""'

[GPhotos.patches]
"github:Akash-Sriram/morphe-google-photos" = { version = "dev" }
