name: Delete old releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases older than the three newest per source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" \
            --jq '.[] | .ref | sub("^refs/tags/"; "")' \
            | sort -r \
            | awk '/^[0-9][0-9]\.[0-9][0-9]\.[0-9][0-9]-/ { tag = $0; source = $0; sub(/^[^-]*-/, "", source); if (++count[source] > 3) print tag }' \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              done
