name: Update release manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and commit release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python src/scripts/site_manifest.py --repo "$REPOSITORY" --output assets/releases.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/releases.json
          if git diff --cached --quiet; then
            echo "Release manifest is already up to date."
            exit 0
          fi
          git commit -m "chore: update release manifest"
          git push
