name: Build APKs

on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: "Select patch source"
        required: true
        default: "morphe"
        type: choice
        options:
          - morphe
          - morphe-dev
          - piko
          - piko-dev
          - rushi
          - hoo-dles
          - hooman
          - paresh
          - de-vanced
          - tiktok

  workflow_call:
    inputs:
      patch_source:
        default: "morphe"
        type: string
      filter_changelog:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare version and draft release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(date +%y.%m.%d)-${{ inputs.patch_source }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VER" --draft --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VER" \
              --draft \
              --title "$VER" \
              --notes "" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Set matrix based on patch source
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix get-matrix '${{ inputs.patch_source }}')"
          echo "matrix=$(echo "$RESULT" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESULT" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: uv run main.py ${{ matrix.id }} ${{ matrix.arch }}

      - name: Upload APKs to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          apks=(./build/*.apk)

          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi

          gh release upload "$TAG" "${apks[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload build log to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.md ]] || exit 0
          [[ -s build.md ]] || exit 0

          cp build.md "build-${LABEL}.md"

          gh release upload "$TAG" "build-${LABEL}.md" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          has=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')

          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      - name: Download logs from draft release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p logs

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "build-*.md" \
            --dir logs

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name | startswith("build-")) | .apiUrl' |
            xargs -I{} gh api --method DELETE "{}"

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          uv run python -m src.scripts.logs combine-logs logs |
            sed "s/{TAG}/$TAG/g" > final.md

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease \
              --title "$TAG" \
              --notes-file final.md
          else
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --title "$TAG" \
              --notes-file final.md
          fi

      - name: Delete empty draft if no APKs
        if: steps.check.outputs.has_apks != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          gh release delete "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes || true

  update-manifest:
    needs: [prepare, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest

    concurrency:
      group: patchpile-release-manifest
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.version }}"

          has=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')

          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      - name: Delete releases older than the three newest per source
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r '(add // []) | map(select(.draft == false)) | sort_by(.tag_name | sub("^[^-]*-"; "")) | group_by(.tag_name | sub("^[^-]*-"; "")) | .[] | sort_by(.published_at) | reverse | .[3:][] | .tag_name')

          if [[ -z "${tags//[$'\t\r\n ']}" ]]; then
            echo "### 🗑️ Release Cleanup" >> "$GITHUB_STEP_SUMMARY"
            echo "No releases to delete." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🗑️ Release Cleanup" >> "$GITHUB_STEP_SUMMARY"
            echo "Deleted the following releases:" >> "$GITHUB_STEP_SUMMARY"
            while read -r tag; do
              [[ -z "$tag" ]] && continue
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$tags"
          fi

      - name: Generate and push release manifest
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --ff-only origin main

          uv run python -m src.scripts.site_manifest \
            --repo "$REPOSITORY" \
            --output assets/releases.json

          git add assets/releases.json

          if git diff --cached --quiet; then
            echo "Release manifest is unchanged"
          else
            git commit -m "chore: update release manifest"
            git push origin HEAD:main
          fi

      - name: Fetch release notes for notifications
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > final.md

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: uv run python -m src.scripts.telegram notify '${{ inputs.patch_source }}'

      - name: Send Web Push notifications
        if: steps.check.outputs.has_apks == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://anikploodichlpgfymiq.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || 'sb_publishable_r6Q5fgqVFu9TkH21jtmGjw_9MRXOYz8' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'BKHQ6jfcI8aUOUHR10SH2DmKDTEz9kX9thkdzR-8ZEY462f8LMutAfe9XLcxMnFye4rCS1tZ0i3Gnx1oNy-tjmE' }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL || 'mailto:admin@patchpile.app' }}
        run: uv run --with pywebpush python -m src.scripts.push_notify notify '${{ inputs.patch_source }}'
